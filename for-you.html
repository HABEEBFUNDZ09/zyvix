
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090f">
  <title>ZYVIX — Gaming Community</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #09090f;
      --panel: #11111b;
      --panel2: #181824;
      --purple: #a855f7;
      --pink: #ec4899;
      --text: #f5f3ff;
      --muted: #9995ae;
      --border: #292638;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 18px;
      background: rgba(9,9,15,.94);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(15px);
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(100deg, #c084fc, #ec4899);
      -webkit-background-clip: text;
      color: transparent;
    }

    .tagline { color: var(--muted); font-size: 11px; }

    .page {
      width: 100%;
      max-width: 720px;
      margin: auto;
      padding: 18px 14px 100px;
    }

    .welcome {
      padding: 22px;
      border: 1px solid #48316a;
      border-radius: 20px;
      background: linear-gradient(135deg, #211135, #11111b 70%);
      margin-bottom: 18px;
    }

    .welcome h1 { margin: 0 0 8px; font-size: 25px; }
    .welcome p { margin: 0; color: #c6b7dd; line-height: 1.5; }

    .tabs {
      display: flex;
      gap: 10px;
      margin: 18px 0;
    }

    .tab {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 8px;
      background: var(--panel);
      color: var(--muted);
      font-weight: 700;
    }

    .tab.active {
      background: #29183e;
      border-color: var(--purple);
      color: white;
    }

    .composer, .post, .empty {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      margin-bottom: 16px;
    }

    .composer { padding: 16px; }

    .section-title {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    textarea, input, select {
      width: 100%;
      padding: 13px;
      color: var(--text);
      background: #0b0b13;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
    }

    textarea { resize: vertical; min-height: 90px; }
    textarea:focus, input:focus, select:focus { border-color: var(--purple); }

    .field { margin-top: 10px; }

    .primary {
      border: 0;
      border-radius: 12px;
      padding: 12px 17px;
      color: white;
      font-weight: 800;
      background: linear-gradient(100deg, #9333ea, #db2777);
    }

    .primary:disabled { opacity: .55; cursor: wait; }

    .composer-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
    }

    .muted { color: var(--muted); font-size: 12px; }

    .post { padding: 16px; }

    .post-head {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 13px;
    }

    .avatar {
      width: 43px;
      height: 43px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      font-weight: 900;
      background: linear-gradient(135deg, #9333ea, #ec4899);
      overflow: hidden;
    }

    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    .author { font-weight: 800; font-size: 14px; }
    .meta { margin-top: 4px; color: var(--muted); font-size: 11px; }
    .game-tag {
      margin-left: auto;
      padding: 6px 9px;
      border-radius: 9px;
      background: #26163a;
      color: #d8b4fe;
      font-size: 11px;
      font-weight: 700;
    }

    .post-content {
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .post-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .action {
      flex: 1;
      padding: 10px 5px;
      border: 1px solid transparent;
      border-radius: 10px;
      color: #c7c2d8;
      background: var(--panel2);
      font-size: 12px;
    }

    .action.liked {
      color: #f0abfc;
      border-color: #7536a8;
      background: #29183e;
    }

    .comments {
      margin-top: 13px;
      padding-top: 13px;
      border-top: 1px solid var(--border);
    }

    .comment {
      padding: 10px;
      margin-bottom: 8px;
      background: #191923;
      border-radius: 10px;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .comment strong { color: #d8b4fe; }
    .comment-form { display: flex; gap: 8px; margin-top: 10px; }
    .comment-form input { min-width: 0; }
    .comment-form button { white-space: nowrap; }

    .empty { padding: 28px 18px; text-align: center; color: var(--muted); }
    .empty h3 { color: white; margin-top: 0; }

    .notice {
      display: none;
      margin-bottom: 15px;
      padding: 12px;
      border-radius: 12px;
      background: #241b35;
      color: #e9d5ff;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      justify-content: space-around;
      padding: 10px 4px calc(10px + env(safe-area-inset-bottom));
      background: rgba(15,15,24,.97);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(16px);
    }

    .nav-item {
      color: var(--muted);
      text-decoration: none;
      font-size: 11px;
      text-align: center;
      min-width: 55px;
    }

    .nav-item span { display: block; font-size: 20px; margin-bottom: 4px; }
    .nav-item.active { color: #d8b4fe; }

    .refresh {
      color: #d8b4fe;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      padding: 8px 11px;
    }

    @media (min-width: 650px) {
      .page { padding-top: 24px; }
      .welcome h1 { font-size: 30px; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div>
      <div class="logo">ZYVIX</div>
      <div class="tagline">YOUR GAME. YOUR COMMUNITY.</div>
    </div>
    <button class="refresh" id="refreshBtn">↻ Refresh</button>
  </header>

  <main class="page">
    <section class="welcome">
      <h1>Welcome to ZYVIX 🎮</h1>
      <p>Share your gaming moments, meet players, and join the community.</p>
    </section>

    <div id="notice" class="notice"></div>

    <div class="tabs">
      <button class="tab active" id="allTab">🌍 For You</button>
      <button class="tab" id="followingTab">👥 Following</button>
    </div>

    <section class="composer">
      <div class="section-title">✨ Create a post</div>
      <textarea id="postContent" maxlength="2000"
        placeholder="What's happening in your gaming world?"></textarea>

      <div class="field">
        <select id="gameSelect">
          <option value="General Gaming">🎮 General Gaming</option>
          <option value="Free Fire">🔥 Free Fire</option>
          <option value="Fortnite">🎯 Fortnite</option>
          <option value="Roblox">🧱 Roblox</option>
          <option value="Call of Duty Mobile">💥 Call of Duty Mobile</option>
          <option value="Blood Strike">⚡ Blood Strike</option>
          <option value="Minecraft">⛏️ Minecraft</option>
          <option value="Genshin Impact">✨ Genshin Impact</option>
          <option value="Other">🎮 Other</option>
        </select>
      </div>

      <div class="composer-footer">
        <span class="muted" id="userStatus">Checking account…</span>
        <button class="primary" id="publishBtn">Post 🚀</button>
      </div>
    </section>

    <div class="section-title">🔥 Community feed</div>
    <div id="feed">
      <div class="empty">Loading posts…</div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a class="nav-item" href="index.html"><span>🏠</span>Home</a>
    <a class="nav-item active" href="for-you.html"><span>🌍</span>For You</a>
    <a class="nav-item" href="login.html"><span>👤</span>Account</a>
  </nav>

  <script>
    // Your existing ZYVIX Supabase project.
    const SUPABASE_URL = "https://ncrlagqvaxwncuuwidzc.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_rrFCTlSFqEKwJgTLL-qIPw_5VyE7sTH";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const $ = (id) => document.getElementById(id);
    let currentUser = null;
    let followingMode = false;
    let cachedPosts = [];

    function showNotice(message) {
      const notice = $("notice");
      notice.textContent = message;
      notice.style.display = "block";
    }

    function hideNotice() {
      $("notice").style.display = "none";
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function formatDate(value) {
      if (!value) return "Recently";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "Recently";
      return date.toLocaleString([], {
        dateStyle: "medium",
        timeStyle: "short"
      });
    }

    function displayName(profile, userId) {
      return profile?.username ||
        (userId ? "Player " + userId.slice(0, 6) : "Player");
    }

    async function loadAccount() {
      const { data, error } = await db.auth.getUser();

      currentUser = data?.user || null;

      $("userStatus").textContent = currentUser
        ? "Signed in as " +
          (currentUser.email || "player")
        : "Sign in to post and interact";

      if (error) console.warn("Account check:", error.message);
    }

    async function loadFeed() {
      hideNotice();
      $("feed").innerHTML = '<div class="empty">Loading posts…</div>';

      try {
        const { data: posts, error: postsError } = await db
          .from("posts")
          .select("id,user_id,content,game,created_at")
          .order("created_at", { ascending: false })
          .limit(50);

        if (postsError) throw postsError;

        const list = posts || [];
        cachedPosts = list;

        if (list.length === 0) {
          $("feed").innerHTML = `
            <div class="empty">
              <h3>It's quiet in here 🎮</h3>
              Be the first player to share something with the community!
            </div>`;
          return;
        }

        const userIds = [...new Set(list.map(p => p.user_id).filter(Boolean))];
        const postIds = list.map(p => p.id);

        let profiles = [];
        let likes = [];
        let comments = [];

        if (userIds.length) {
          const result = await db.from("profiles")
            .select("id,username,avatar_url")
            .in("id", userIds);
          if (result.error) console.warn("Profiles:", result.error.message);
          profiles = result.data || [];
        }

        if (postIds.length) {
          const likeResult = await db.from("likes")
            .select("post_id,user_id")
            .in("post_id", postIds);
          if (likeResult.error) console.warn("Likes:", likeResult.error.message);
          likes = likeResult.data || [];

          const commentResult = await db.from("comments")
            .select("id,post_id,user_id,content,created_at")
            .in("post_id", postIds)
            .order("created_at", { ascending: true });

          if (commentResult.error) {
            console.warn("Comments:", commentResult.error.message);
          } else {
            comments = commentResult.data || [];
          }
        }

        const profileMap = new Map(profiles.map(p => [p.id, p]));
        const likeMap = new Map();
        const commentMap = new Map();

        likes.forEach(like => {
          if (!likeMap.has(like.post_id)) likeMap.set(like.post_id, []);
          likeMap.get(like.post_id).push(like);
        });

        comments.forEach(comment => {
          if (!commentMap.has(comment.post_id)) {
            commentMap.set(comment.post_id, []);
          }
          commentMap.get(comment.post_id).push(comment);
        });

        const commentUserIds = [...new Set(
          comments.map(c => c.user_id).filter(Boolean)
        )];

        let commentProfiles = [];
        if (commentUserIds.length) {
          const result = await db.from("profiles")
            .select("id,username")
            .in("id", commentUserIds);
          commentProfiles = result.data || [];
        }

        const commentProfileMap = new Map(
          commentProfiles.map(p => [p.id, p])
        );

        $("feed").innerHTML = list.map(post => {
          const profile = profileMap.get(post.user_id);
          const name = displayName(profile, post.user_id);
          const avatar = profile?.avatar_url;
          const postLikes = likeMap.get(post.id) || [];
          const postComments = commentMap.get(post.id) || [];
          const liked = !!currentUser && postLikes.some(
            like => like.user_id === currentUser.id
          );

          const avatarHTML = avatar
            ? `<img src="${escapeHTML(avatar)}" alt=""
                 onerror="this.remove()">`
            : escapeHTML(name.charAt(0).toUpperCase());

          const commentsHTML = postComments.map(comment => {
            const commentProfile = commentProfileMap.get(comment.user_id);
            const commentName = displayName(
              commentProfile, comment.user_id
            );

            return `
              <div class="comment">
                <strong>${escapeHTML(commentName)}</strong>
                <div>${escapeHTML(comment.content)}</div>
                <div class="meta">${escapeHTML(formatDate(comment.created_at))}</div>
              </div>`;
          }).join("");

          return `
            <article class="post" id="post-${escapeHTML(post.id)}">
              <div class="post-head">
                <div class="avatar">${avatarHTML}</div>
                <div>
                  <div class="author">${escapeHTML(name)}</div>
                  <div class="meta">${escapeHTML(formatDate(post.created_at))}</div>
                </div>
                <span class="game-tag">${escapeHTML(post.game || "Gaming")}</span>
              </div>

              <div class="post-content">${escapeHTML(post.content)}</div>

              <div class="post-actions">
                <button class="action ${liked ? "liked" : ""}"
                  data-action="like" data-id="${escapeHTML(post.id)}">
                  ${liked ? "💜 Liked" : "🤍 Like"} · ${postLikes.length}
                </button>
                <button class="action"
                  data-action="comments" data-id="${escapeHTML(post.id)}">
                  💬 Comment · ${postComments.length}
                </button>
              </div>

              <div class="comments" id="comments-${escapeHTML(post.id)}"
                   style="display:none">
                ${commentsHTML || '<div class="muted">No comments yet. Start the conversation!</div>'}
                <form class="comment-form" data-post="${escapeHTML(post.id)}">
                  <input name="comment" maxlength="500"
                    placeholder="Write a comment…" required>
                  <button class="primary" type="submit">Send</button>
                </form>
              </div>
            </article>`;
        }).join("");

        if (followingMode) {
          showNotice("Following is not connected yet. This feed currently shows community posts from everyone.");
        }
      } catch (error) {
        console.error(error);
        $("feed").innerHTML = `
          <div class="empty">
            <h3>Couldn't load the feed</h3>
            <p>${escapeHTML(error.message || "Please try again.")}</p>
            <button class="primary" onclick="loadFeed()">Try again</button>
          </div>`;
      }
    }

    async function publishPost() {
      hideNotice();

      if (!currentUser) {
        showNotice("Please sign in first, then return here to publish a post.");
        return;
      }

      const content = $("postContent").value.trim();
      const game = $("gameSelect").value;

      if (!content) {
        showNotice("Write something before publishing your post.");
        return;
      }

      const button = $("publishBtn");
      button.disabled = true;
      button.textContent = "Posting…";

      try {
        const { error } = await db.from("posts").insert({
          user_id: currentUser.id,
          content,
          game
        });

        if (error) throw error;

        $("postContent").value = "";
        showNotice("Your post has been published! 🚀");
        await loadFeed();
      } catch (error) {
        console.error(error);
        showNotice("Couldn't publish: " + (error.message || "Please try again."));
      } finally {
        button.disabled = false;
        button.textContent = "Post 🚀";
      }
    }

    async function toggleLike(postId) {
      if (!currentUser) {
        showNotice("Please sign in before liking posts.");
        return;
      }

      hideNotice();

      try {
        const { data: existing, error: findError } = await db
          .from("likes")
          .select("post_id,user_id")
          .eq("post_id", postId)
          .eq("user_id", currentUser.id)
          .maybeSingle();

        if (findError) throw findError;

        if (existing) {
          const { error } = await db.from("likes")
            .delete()
            .eq("post_id", postId)
            .eq("user_id", currentUser.id);
          if (error) throw error;
        } else {
          const { error } = await db.from("likes").insert({
            post_id: postId,
            user_id: currentUser.id
          });
          if (error) throw error;
        }

        await loadFeed();
      } catch (error) {
        console.error(error);
        showNotice("Couldn't update like: " + (error.message || "Check your database permissions."));
      }
    }

    async function addComment(postId, content) {
      if (!currentUser) {
        showNotice("Please sign in before commenting.");
        return;
      }

      const text = content.trim();
      if (!text) return;

      try {
        const { error } = await db.from("comments").insert({
          post_id: postId,
          user_id: currentUser.id,
          content: text
        });

        if (error) throw error;
        await loadFeed();

        const box = $("comments-" + postId);
        if (box) box.style.display = "block";
      } catch (error) {
        console.error(error);
        showNotice("Couldn't add comment: " + (error.message || "Check your database permissions."));
      }
    }

    $("publishBtn").addEventListener("click", publishPost);
    $("refreshBtn").addEventListener("click", async () => {
      await loadAccount();
      await loadFeed();
    });

    $("allTab").addEventListener("click", () => {
      followingMode = false;
      $("allTab").classList.add("active");
      $("followingTab").classList.remove("active");
      loadFeed();
    });

    $("followingTab").addEventListener("click", () => {
      followingMode = true;
      $("followingTab").classList.add("active");
      $("allTab").classList.remove("active");
      loadFeed();
    });

    $("feed").addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;

      const postId = button.dataset.id;

      if (button.dataset.action === "like") {
        await toggleLike(postId);
      }

      if (button.dataset.action === "comments") {
        const box = $("comments-" + postId);
        if (box) {
          box.style.display = box.style.display === "none" ? "block" : "none";
        }
      }
    });

    $("feed").addEventListener("submit", async (event) => {
      const form = event.target.closest(".comment-form");
      if (!form) return;

      event.preventDefault();
      const input = form.elements.comment;
      const submitButton = form.querySelector("button");
      const postId = form.dataset.post;

      submitButton.disabled = true;
      await addComment(postId, input.value);
      submitButton.disabled = false;
    });

    async function start() {
      await loadAccount();
      await loadFeed();
    }

    start();
  </script>
</body>
</html>
